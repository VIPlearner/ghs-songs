name: Sign hymn content

# On any change to hymns/ on main, rebuild a signed manifest (sha256 of each
# hymns_*.json) and publish the content + manifest + signature to the `signed`
# branch, which the app reads and verifies with its bundled public key.

on:
  push:
    branches: [main]
    paths: ['hymns/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-content
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hymns/ from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: hymns
          sparse-checkout-cone-mode: false

      - name: Build + sign manifest
        env:
          SIGNING_KEY: ${{ secrets.CONTENT_SIGNING_PRIVATE_KEY }}
        run: |
          cd hymns
          python3 - <<'PY'
          import json, hashlib, glob, os
          files = {}
          for f in sorted(glob.glob("hymns_*.json")):
              files[os.path.basename(f)] = hashlib.sha256(open(f, "rb").read()).hexdigest()
          open("manifest.json", "w").write(
              json.dumps({"version": 1, "files": files}, separators=(",", ":"), sort_keys=True)
          )
          PY
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/m.sig" manifest.json
          base64 -w0 "$RUNNER_TEMP/m.sig" > manifest.json.sig
          rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/m.sig"

      - name: Publish to the signed branch
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp hymns/hymns_*.json hymns/manifest.json hymns/manifest.json.sig "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q
          git checkout -q -b signed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Signed hymn content"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" signed
